<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<link rel="icon" href="%PUBLIC_URL%/favicon.png" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="theme-color" content="#000000" />
	<meta name="description"
		content="An unofficial Call of Duty Zombies: Dark Aether, Black Ops Cold War and Black Ops 6 interactive collectables map and calling card challenge tracker. Keep track of your progress on which intel and calling cards you still need to collect." />
	<meta name="google-site-verification" content="ZZ_rc-e2KNBuSMe0_Q89tgJgJSkOxp7zjtBILHjR4SM" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link rel="preload"
		href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
		as="style"
		onload="this.onload=null;this.rel='stylesheet'" />
	<noscript>
		<link rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" />
	</noscript>
	<link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
	<link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
	<title>DECLASSIFIED - Call of Duty Zombies: Black Ops Intel Map</title>
	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.8.0/dist/leaflet.css"
		integrity="sha512-hoalWLoI8r4UszCkZ5kL8vayOGVae1oxXe/2A4AO6J9+580uKHDO3JdHb7NzwwzK5xr/Fs0W40kiNHxM9vyTtQ=="
		crossOrigin="" />
</head>

<body>
	<noscript>You need to enable JavaScript to run this app.</noscript>
	<div id="root"></div>
	<!--
		Inset outline filter for the intel map pins. The faction backgrounds are flat
		PNGs of a single colour, so a 1px black edge is generated by eroding the alpha
		channel and subtracting it from the original alpha. The ring is drawn inside the
		silhouette, which keeps the marker the same size as before.
	-->
	<svg id="marker-icon-defs" width="0" height="0" aria-hidden="true" focusable="false">
		<defs>
			<filter id="intel-marker-inner-outline" primitiveUnits="userSpaceOnUse">
				<!-- binarise the alpha first, otherwise the ring inherits the edge ramp
				     and renders as a soft, blotchy band instead of a solid line -->
				<feComponentTransfer in="SourceAlpha" result="solid">
					<feFuncA type="linear" slope="4" intercept="-1.2" />
				</feComponentTransfer>
				<feMorphology in="solid" operator="erode" radius="1" result="inner" />
				<feComposite in="solid" in2="inner" operator="out" result="ring" />
				<feFlood floodColor="#000000" result="black" />
				<feComposite in="black" in2="ring" operator="in" result="outline" />
				<feMerge>
					<feMergeNode in="SourceGraphic" />
					<feMergeNode in="outline" />
				</feMerge>
			</filter>
		</defs>
	</svg>
</body>

</html>
